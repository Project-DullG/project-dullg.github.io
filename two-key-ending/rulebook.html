<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>룰 설명 · 집에가고 싶어!</title><link rel="stylesheet" href="reader.css"></head><body><main class="slide-shell"><header class="mast"><span>집에가고 싶어! · 룰 설명</span><a href="synopsis.html">시놉시스</a></header><article class="slide" id="slide" tabindex="-1"></article><div class="controls"><span class="count" id="count" aria-live="polite"></span><div class="actions"><button class="btn secondary" id="prev">이전</button><button class="btn secondary" id="play" aria-pressed="false">자동 재생</button><button class="btn" id="next">다음</button></div></div><label><input type="checkbox" id="voice"> 음성으로 읽기</label><p class="speech-status" id="speech-status">음성은 기기에서 제공하는 한국어 음성으로 재생됩니다. 소리가 없어도 모든 내용을 읽을 수 있습니다.</p><details class="transcript"><summary>전체 내용 읽기</summary><div id="transcript"></div></details><div class="actions"><a class="btn secondary" href="synopsis.html">시놉시스 보기</a><a class="btn secondary" href="rulebook.pdf">8쪽 룰북 PDF</a></div><footer class="footer">게임 시작 전 확인 · 2026.09.16 개정</footer></main><script id="slides-data" type="application/json">[{"title": "게임 준비", "paragraphs": ["네 사람은 윤지원, 박세준, 차하린, 한도경 중 한 명씩 맡습니다.", "자신의 인물 시트를 혼자 읽고, 소지품 카드 3장을 비공개로 가지고 시작합니다. 다른 사람에게 시트를 보여주지 않습니다.", "공통 단서 1~3번과 투표 안내 4번을 순서대로 따로 놓습니다. 모두 함께 시놉시스를 읽고 자기소개를 한 뒤 선 플레이어를 정합니다."], "visual": "setup"}, {"title": "첫 라운드", "paragraphs": ["선 플레이어가 자기 소지품 카드 1장을 공개합니다.", "자신을 제외한 두 명을 지목합니다. 지목받은 두 사람은 각자 소지품 카드 1장씩 공개합니다.", "공개된 카드를 바탕으로 5분 동안 토론합니다. 토론이 끝나면 공통 단서 1번을 공개합니다."], "visual": "first"}, {"title": "다음 라운드의 지목권", "paragraphs": ["직전 라운드에서 지목받아 공개한 카드 1장당, 다음 라운드의 지목권 1회를 받습니다. 한 사람이 2장을 공개했다면 지목권 2회를 맡습니다.", "지목자가 되었다는 이유로 자기 카드를 먼저 공개하지 않습니다. 선 플레이어의 자기 공개는 첫 라운드에만 합니다."], "visual": "rights"}, {"title": "지목은 한 번씩 차례대로", "paragraphs": ["지목은 총 2회입니다. 자신을 제외하고 공개할 소지품 카드가 남은 사람을 고릅니다.", "한 번 지목할 때마다 해당 사람이 카드 1장을 공개합니다. 공개가 끝난 뒤 다음 지목을 진행합니다.", "카드가 없는 사람은 지목할 수 없습니다. 첫 지목으로 마지막 카드를 공개한 사람은 다음 지목의 대상이 될 수 없습니다."], "visual": "sequence"}, {"title": "한 사람이 두 번 지목받았다면", "paragraphs": ["예를 들어 B와 C가 차례대로 D를 지목해 D가 2장을 공개했다면, 다음 라운드에는 D가 지목권 2회를 맡습니다.", "지목권이 2회인 사람은 두 명을 한 번씩 지목하거나, 카드가 남아 있는 같은 사람을 두 번 지목할 수 있습니다."], "visual": "duplicate"}, {"title": "토론과 공통 단서", "paragraphs": ["카드 공개가 끝나면 다시 5분 동안 토론합니다. 토론 뒤 공통 단서를 번호순으로 1장씩 공개합니다.", "1~3번째 토론이 끝날 때 공통 단서 1~3번을 공개합니다. 3번 단서 뒤에는 최종 토론을 진행합니다.", "최종 토론이 끝나면 4번 투표 안내를 확인합니다."], "visual": "discussion"}, {"title": "카드 공개를 멈추는 시점", "paragraphs": ["공개되지 않은 소지품 카드가 총 3장 남으면 카드 공개를 멈춥니다.", "최종 토론을 진행한 뒤 투표합니다. 공통 단서 카드는 남은 소지품 카드 수에 포함하지 않습니다."], "visual": "stop"}, {"title": "토론할 때 지킬 것", "paragraphs": ["맡은 캐릭터의 입장에서 말합니다. 공개된 소지품과 공통 단서를 근거로 질문하고 의심합니다.", "자신의 생각, 추측, 감정, 변명은 자유롭게 말할 수 있습니다. 모든 정보를 반드시 말할 필요는 없습니다.", "공개된 카드의 문구를 일부러 왜곡하지 않습니다. 자신의 인물 시트와 아직 공개되지 않은 카드는 직접 보여주지 않습니다.", "밀담이나 비공개 조사 없이 테이블 전체가 함께 토론합니다."], "visual": "table"}, {"title": "최종 투표", "paragraphs": ["각자 누가 두 열쇠를 사라지게 했는지 결론을 정하고, 동시에 가장 수상한 인물을 지목합니다.", "동률이 나오면 해당 인물들은 각각 2분씩 최후 변론을 한 뒤 다시 한 번 투표합니다."], "visual": "vote"}, {"title": "투표가 끝난 뒤", "paragraphs": ["최종 투표가 끝나면 룰북의 엔딩 QR을 스캔합니다. 투표 전에는 엔딩을 열지 않습니다.", "자신의 인물 시트를 기준으로 점수를 확인하고, 지목 결과와 사건의 전말을 확인합니다."], "visual": "ending"}]</script><script src="slides.js"></script></body></html>
