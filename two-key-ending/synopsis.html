 걸려 있었다."], "visual": "map"}, {"title": "핸드폰함과 두 열쇠", "paragraphs": ["학생들이 제출한 휴대폰은 3층 복도 아래쪽 책장 오른편 핸드폰함에 들어 있었다.", "자료함 열쇠가 없으면 재시험을 시작할 수 없다. 핸드폰함 열쇠가 없으면 제출한 휴대폰을 돌려받을 수 없다."], "visual": "map"}, {"title": "저녁 7시 10분", "paragraphs": ["원장님은 2층 수업과 마감 확인 때문에 잠시 자리를 비운 상태였다.\n저녁 7시 10분, 재시험을 시작하려고 3층으로 올라온 원장님은 원장실 입구 쪽 공용 볼펜 선반을 확인했다. 있어야 할 두 열쇠가 보이지 않았다.", "원장님은 낮은 목소리로 말했다.\n“8시까지 두 열쇠를 찾아야 재시험을 시작할 수 있어. 오늘 시험을 진행하지 못하면 네 명 모두 토요일 오후 보충반에 다시 나와야 해.”"], "visual": "clock"}, {"title": "찾아봤지만 없었다", "paragraphs": ["주말 보충반이라는 말에 네 사람의 표정이 굳었다.\n원장님과 학생들은 선반 주변과 원장실 안쪽 자료함 근처를 찾아보았다. 하지만 두 열쇠는 나오지 않았다. 원장님은 2층 수업을 마저 확인해야 했기 때문에, 학생들에게 나머지 장소도 찾아보라고 말하고 다시 내려갔다.", "네 사람은 자습실, 복도, 정수기 근처와 핸드폰함 주변까지 찾아보았다. 열쇠는 없었다.\n현재 시각은 저녁 7시 25분. 마감까지 35분이 남았다."], "visual": ""}, {"title": "확인할 수 있는 것", "paragraphs": ["원장님이 열쇠를 확인하러 오기 전, 사건이 일어난 무렵 3층에는 네 학생만 남아 있었다. 자습실 안에는 CCTV가 없다. 복도 CCTV도 며칠 전부터 화면이 자주 끊기는 문제가 있었다.\n재시험 준비 중 자습실 밖으로 나가는 것은 원칙적으로 좋지 않지만, 물을 마시거나 화장실에 가는 정도의 이동은 가능했다."], "visual": ""}, {"title": "각자의 가방", "paragraphs": ["이제 아직 확인하지 않은 곳은 각자의 가방뿐이다.\n네 사람은 잠시 서로를 바라보았다. 그리고 차례대로 가방 속 물건을 꺼내 확인하기로 했다."], "visual": ""}]</script><script src="slides.js"></script></body></html>
